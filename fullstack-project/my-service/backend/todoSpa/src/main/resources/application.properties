spring.application.name=todoSpa

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mydb?serverTimezone=UTC&useSSL=false
spring.datasource.url=jdbc:mysql://localhost:3306/scottdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=scott
spring.datasource.password=tiger

# JPA설정 - 애플리케이션 실행 시 DB 테이블 자동 생성 또는 수정(update: 변경된 엔티티 기준으로 테이블 구조 업데이트)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

logging.level.org.hibernate=info